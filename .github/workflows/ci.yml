name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  syntax:
    name: Syntax check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check shell syntax
        run: bash -n statusline-command.sh

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq
      - name: Run tests
        run: bats tests/
